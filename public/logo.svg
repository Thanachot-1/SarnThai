<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@600;700&amp;display=swap');
      .logo-thai-char {
        font-family: 'Prompt', 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        font-size: 56px;
        fill: #FAF7F9;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
    <!-- Royal Mulberry Gradient -->
    <linearGradient id="sarnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1744"/>
      <stop offset="50%" stop-color="#3B1437"/>
      <stop offset="100%" stop-color="#280926"/>
    </linearGradient>
    
    <!-- Golden Silk Shimmer Gradient -->
    <linearGradient id="sarnGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D18E"/>
      <stop offset="50%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#B88028"/>
    </linearGradient>

    <!-- Subtle Inner Shadow / Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Square Container -->
  <rect 
    x="2" 
    y="2" 
    width="96" 
    height="96" 
    rx="22" 
    fill="url(#sarnBgGrad)" 
    stroke="url(#sarnGoldGrad)" 
    stroke-width="1.8" 
    stroke-opacity="0.45"
  />

  <!-- Traditional Thai Silk Weave Pattern in Background -->
  <g opacity="0.09" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round">
    <line x1="16" y1="32" x2="84" y2="32"/>
    <line x1="16" y1="50" x2="84" y2="50"/>
    <line x1="16" y1="68" x2="84" y2="68"/>
    <line x1="32" y1="16" x2="32" y2="84"/>
    <line x1="50" y1="16" x2="50" y2="84"/>
    <line x1="68" y1="16" x2="68" y2="84"/>
  </g>

  <!-- Thai Character 'ส' (Centered and Crisp) -->
  <text 
    x="48" 
    y="55" 
    class="logo-thai-char" 
    filter="url(#subtleGlow)"
  >
    ส
  </text>

  <!-- Golden Silk Star / Sparkle in Top-Right -->
  <path 
    d="M78 14L80.8 20.2L87 23L80.8 25.8L78 32L75.2 25.8L69 23L75.2 20.2Z" 
    fill="url(#sarnGoldGrad)" 
    opacity="0.95"
  />
  <circle cx="78" cy="23" r="1" fill="#FFFFFF"/>
</svg>
