<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Royal Mulberry Canvas Background -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D1745"/>
      <stop offset="45%" stop-color="#3B1437"/>
      <stop offset="100%" stop-color="#230621"/>
    </linearGradient>

    <!-- 24K Golden Silk Primary Gradient -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6"/>
      <stop offset="25%" stop-color="#F3CA76"/>
      <stop offset="60%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#9C6B22"/>
    </linearGradient>

    <!-- Golden Silk Secondary (Cross-Weft) Gradient -->
    <linearGradient id="goldSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA8"/>
      <stop offset="35%" stop-color="#E5B562"/>
      <stop offset="70%" stop-color="#C28B36"/>
      <stop offset="100%" stop-color="#7A4E12"/>
    </linearGradient>

    <!-- Silk Magenta Ribbon Accent Gradient -->
    <linearGradient id="magentaSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C03A96"/>
      <stop offset="50%" stop-color="#8C246E"/>
      <stop offset="100%" stop-color="#5E1449"/>
    </linearGradient>

    <!-- Shimmer Center Core -->
    <radialGradient id="centerShimmer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFE5A3"/>
      <stop offset="75%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#8A5A16"/>
    </radialGradient>

    <!-- Subtle Soft Drop Shadow -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect 
    x="3" 
    y="3" 
    width="94" 
    height="94" 
    rx="22" 
    fill="url(#logoBgGrad)" 
    stroke="url(#goldPrimary)" 
    stroke-width="1.6" 
    stroke-opacity="0.5"
  />

  <!-- Subtle Radial Ambient Glow -->
  <circle cx="50" cy="50" r="36" fill="#8C246E" opacity="0.18"/>

  <!-- Geometric Thai Weave Background Motif (Subtle Texture) -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round">
    <line x1="20" y1="20" x2="80" y2="80"/>
    <line x1="80" y1="20" x2="20" y2="80"/>
    <line x1="50" y1="16" x2="50" y2="84"/>
    <line x1="16" y1="50" x2="84" y2="50"/>
  </g>

  <!-- The SarnThai Weave Crest (สัญลักษณ์ลายสานมงคล - Pra Jam Yarm Weave) -->
  <g filter="url(#logoShadow)">
    
    <!-- Outer Diagonal Woven Diamond Ring (4 Corner Knots) -->
    <path 
      d="M50 20 L80 50 L50 80 L20 50 Z" 
      fill="none" 
      stroke="url(#goldSecondary)" 
      stroke-width="2.2" 
      stroke-linejoin="round"
      opacity="0.85"
    />

    <!-- Inner Diagonal Diamond Ribbon -->
    <path 
      d="M50 27 L73 50 L50 73 L27 50 Z" 
      fill="none" 
      stroke="url(#magentaSilk)" 
      stroke-width="2" 
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- 4 Interlocking Weave Petals / Loops (North, East, South, West) -->
    <!-- North Petal -->
    <path 
      d="M50 18 C57 18 63 25 61 36 C59 44 54 48 50 48 C46 48 41 44 39 36 C37 25 43 18 50 18 Z" 
      fill="url(#goldPrimary)" 
      opacity="0.95"
    />
    
    <!-- South Petal -->
    <path 
      d="M50 82 C43 82 37 75 39 64 C41 56 46 52 50 52 C54 52 59 56 61 64 C63 75 57 82 50 82 Z" 
      fill="url(#goldPrimary)" 
      opacity="0.95"
    />

    <!-- East Petal -->
    <path 
      d="M82 50 C82 57 75 63 64 61 C56 59 52 54 52 50 C52 46 56 41 64 39 C75 37 82 43 82 50 Z" 
      fill="url(#goldSecondary)" 
      opacity="0.95"
    />

    <!-- West Petal -->
    <path 
      d="M18 50 C18 43 25 37 36 39 C44 41 48 46 48 50 C48 54 44 59 36 61 C25 63 18 57 18 50 Z" 
      fill="url(#goldSecondary)" 
      opacity="0.95"
    />

    <!-- Interlocking Center Weft Knot (Central Pra-Jam-Yarm Core) -->
    <path 
      d="M50 36 L64 50 L50 64 L36 50 Z" 
      fill="#2A0824" 
      stroke="url(#goldPrimary)" 
      stroke-width="1.8"
    />

    <!-- Radiant Center Golden Silk Jewel / Loom Intersection -->
    <path 
      d="M50 41 L59 50 L50 59 L41 50 Z" 
      fill="url(#centerShimmer)"
    />
    
    <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>

    <!-- 4 Diagonal Sparkle Dots (Thai Khid Weave Accents) -->
    <circle cx="32" cy="32" r="2.2" fill="url(#goldPrimary)"/>
    <circle cx="68" cy="32" r="2.2" fill="url(#goldPrimary)"/>
    <circle cx="68" cy="68" r="2.2" fill="url(#goldPrimary)"/>
    <circle cx="32" cy="68" r="2.2" fill="url(#goldPrimary)"/>
  </g>

  <!-- Luxury Golden Silk Sparkle in Top-Right Corner -->
  <path 
    d="M80 14L82.5 19.5L88 22L82.5 24.5L80 30L77.5 24.5L72 22L77.5 19.5Z" 
    fill="url(#goldPrimary)" 
    opacity="0.95"
  />
  <circle cx="80" cy="22" r="0.9" fill="#FFFFFF"/>
</svg>
